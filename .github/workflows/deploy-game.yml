name: Deploy game to GitHub Pages

# Publishes site/ (the hub plus every game) to GitHub Pages.
# The games are plain static files — no build step, no dependencies — so this
# just uploads the folder. `configure-pages` with enablement:true turns Pages on
# the first time it runs, so there is nothing to click in repo settings.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The leaderboard decides who gets paid, so a red test run must not reach the
  # kids. Cheap gate: the deploy waits on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Test files live next to the code they test, which is right for editing
      # and wrong for shipping — they import "vitest", which no importmap on the
      # page resolves. Nothing loads them, but they don't belong on a public site.
      - name: Drop test files from the artifact
        run: rm -f site/**/*.test.js site/*/src/*.test.js

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # The failure mode of a multi-game layout is "moved a file, forgot a
      # path" — a game that 404s its own module loads to a black screen. One
      # sweep catches the whole class, and fails the deploy instead of a kid.
      - name: Check the deployed URLs resolve
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          case "$base" in */) ;; *) base="$base/" ;; esac
          fail=0
          for p in "" \
                   nova/ \
                   vendor/three.module.min.js \
                   vendor/three.core.min.js \
                   shared/base.css \
                   shared/util.js \
                   shared/input.js \
                   shared/leaderboard.js \
                   shared/config.js \
                   shared/identity.js \
                   shared/fx.js \
                   shared/audioengine.js \
                   hub.css \
                   hub.js \
                   hub-weeks.js \
                   nova/style.css \
                   nova/src/main.js \
                   nova/src/hero.js \
                   nova/src/enemies.js \
                   nova/src/world.js \
                   nova/src/projectiles.js \
                   nova/src/hud.js \
                   nova/src/audio.js \
                   nova/src/quality.js \
                   nova/src/touch.js \
                   fish/ \
                   fish/style.css \
                   fish/src/main.js \
                   fish/src/fish.js \
                   fish/src/fishmesh.js \
                   fish/src/lake.js \
                   fish/src/rod.js \
                   fish/src/hud.js \
                   fish/src/pointer.js \
                   fish/src/audio.js \
                   fish/src/quality.js \
                   city/ \
                   city/style.css \
                   city/src/main.js \
                   city/src/car.js \
                   city/src/carmesh.js \
                   city/src/city.js \
                   city/src/collide.js \
                   city/src/shift.js \
                   city/src/hud.js \
                   city/src/audio.js \
                   city/src/quality.js \
                   city/src/touch.js \
                   vendor/jsm/postprocessing/EffectComposer.js \
                   vendor/jsm/postprocessing/RenderPass.js \
                   vendor/jsm/postprocessing/UnrealBloomPass.js \
                   vendor/jsm/postprocessing/OutputPass.js \
                   vendor/jsm/postprocessing/ShaderPass.js \
                   vendor/jsm/postprocessing/MaskPass.js \
                   vendor/jsm/postprocessing/Pass.js \
                   vendor/jsm/shaders/CopyShader.js \
                   vendor/jsm/shaders/LuminosityHighPassShader.js \
                   vendor/jsm/shaders/OutputShader.js \
                   favicon.svg \
                   preview.png; do
            # --retry-all-errors so Pages propagation lag gets another go; a file
            # that is genuinely missing still fails after the retries.
            code=$(curl -s -o /dev/null -w "%{http_code}" \
                     --retry 4 --retry-delay 5 --retry-all-errors "$base$p")
            if [ "$code" != "200" ]; then
              echo "::error::$base$p returned $code"
              fail=1
            else
              echo "ok   $p"
            fi
          done
          exit $fail
